services:
  - type: web
    name: univeps-pi-2
    env: python
    buildCommand: ./render-build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: univespi-db
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FLASK_APP
        value: wsgi.py

databases:
  - name: univespi-db
    plan: free
